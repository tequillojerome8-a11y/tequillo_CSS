<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Padding Activity</title>
</head>

<body style="
    margin: 0;
    background-color: white;
">

    <!-- PURPLE OUTER BOX -->
    <div style="
        width: 100%;
        height: 670px;
        background-color: purple;
        padding: 10px;
        box-sizing: border-box;
    ">

        <!-- BLUE INNER BOX -->
        <div style="
            width: 100%;
            height: 100%;
            background-color: blue;
            padding: 40px;
            box-sizing: border-box;
        ">

            <!-- FIRST YELLOW TEXT -->
            <div style="
                color: yellow;
                font-size: 60px;
                font-family: Georgia, serif;
                margin: 0 0 5px 0;
            ">
                Yellow Text
            </div>

            <!-- FIRST RED BOX -->
            <div style="
                width: 100%;
                height: 150px;
                background-color: red;
                color: white;
                padding: 40px;
                box-sizing: border-box;
                font-size: 55px;
                font-family: Georgia, serif;
            ">
                White Text
            </div>


            <!-- SECOND YELLOW TEXT -->
            <div style="
                color: yellow;
                font-size: 60px;
                font-family: Georgia, serif;
                margin-top: 75px;
                margin-bottom: 5px;
            ">
                Yellow Text
            </div>

            <!-- SECOND RED BOX -->
            <div style="
                width: 100%;
                height: 150px;
                background-color: red;
                color: white;
                padding: 40px;
                box-sizing: border-box;
                font-size: 55px;
                font-family: Georgia, serif;
            ">
                White Text
            </div>

        </div>

    </div>

</body>
</html>
